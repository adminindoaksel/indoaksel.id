        .card {

            padding: 28px;
            border-radius: 14px;

        }

        /* TOMBOL KEMBALI */

        /* TOMBOL KEMBALI */

.back-button {
    display: inline-block;
    color: #287bce;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;

}

/* AREA TOMBOL KEMBALI DAN LOGO */

.top-section {
    background: transparent;
    padding: 0;
    border-radius: 0;
    margin-bottom: 0;
}
        

        .back-button:hover {
            text-decoration: underline;
        }

        /* BARIS LOGO */

        .header-logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .header-logos img {

            max-width: 90px;
            object-fit: contain;

        /* IKON BERHASIL */

        .success-icon {

            height: 54px;
            display: flex;
            justify-content: center;

            margin: 0 auto 16px;
            border-radius: 50%;
            background: #e8f7ef;
            color: #2ead68;
            font-size: 32px;
            font-weight: 700;
        }

        /* JUDUL */

        .success-title {
            color: #287bce;

            font-weight: 700;
            text-align: center;
            margin: 0 0 16px;
        }

        .title-divider {
            width: 70px;
            height: 3px;
            background: #8ec5f5;
            border-radius: 10px;
            margin: 0 auto 22px;
        }

        /* AJAKAN BERGABUNG */

        .whatsapp-invitation {
    text-align: center;
    margin-bottom: 4px;
}

        .whatsapp-icon {
    width: 42px;
    height: 42px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 20px auto 5px;
    border-radius: 50%;
    background: #e8f7ef;
    color: #25a85a;
}

        .whatsapp-icon svg {
            width: 27px;
            height: 27px;
        }

        .whatsapp-invitation p {
    color: #40566d;
    font-size: 13px;
    line-height: 1.7;
    margin: 0;
}

        /* KOTAK INFORMASI */

        .info-box {
            background: #f0f7ff;
            border: 1px solid #d8eaff;
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 0px;
        }

        .info-box p {
            color: #40566d;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
            margin: 0;
        }

        /* STATUS */

        #status {
            color: #40566d;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
            margin: 0;
        }

        /* LOADER */

        .loader {
            width: 32px;
            height: 32px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #25a85a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 8px auto 12px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* TOMBOL GRUP WHATSAPP */

        .whatsapp-button {
    display: none;
    width: 100%;
    padding: 13px 20px;
    background: #287bce;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: not-allowed;
    opacity: 1;
}

.loading-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
        

        .whatsapp-button:hover {
            background: #208f4e;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(37, 168, 90, 0.28);
        }

        /* FOOTER */

        .footer {
    background: transparent;
    color: #263238;
    padding: 0;
    border-radius: 0;
    text-align: center;
    margin-top: 0;
    font-size: 12px;
    font-weight: 400;
}
        /* TAMPILAN HP */

        @media(max-width:520px) {

            }

            .card {

            }

            .header-logos img {
                height: 25px;
                max-width: 75px;
            }

        }

            <!-- AREA TOMBOL KEMBALI DAN LOGO -->

<div class="top-section">

</div>

            <!-- IKON BERHASIL -->

            <div class="success-icon">
                ✓
            </div>

            <!-- JUDUL -->

            <h1 class="success-title">
                SELAMAT, PENDAFTARAN BERHASIL!
            </h1>

            <!-- GARIS PEMISAH -->

            <div class="title-divider"></div>

            <!-- INFORMASI GRUP -->

            <div class="info-box">

                <p id="status">
    Sedang menghubungkan ke Grup WhatsApp...
</p>

<div class="loader" id="loader"></div>
                <!-- TOMBOL BERGABUNG -->

                <button id="whatsappButton" class="whatsapp-button" type="button" disabled>

            </div>
   
        <!-- UCAPAN WHATSAPP -->

<div class="whatsapp-invitation">

    </main>


    <!-- JAVASCRIPT -->

    <script>

        const API_URL = "https://script.google.com/macros/s/AKfycbxEjXWRsp9bguw-rjiVDD6wh4ifu2mzs8G53D6lxtPR8qzjxljX3zY6wHrjmy5Vcbrx/exec";


        async function mulaiRedirect() {

            const status = document.getElementById("status");

            const loader = document.getElementById("loader");

            const whatsappButton = document.getElementById("whatsappButton");
            whatsappButton.style.display = "flex";
            whatsappButton.disabled = true;


            try {

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Server tidak merespons dengan baik.");
                }

                const data = await response.json();


                if (data.success && data.url) {

                    // Tampilkan nama grup

                    status.textContent = "Grup tersedia: " + data.nama;

                    // Hentikan loader

                    loader.style.display = "none";

                    // Tombol tetap pasif selama proses pengalihan

                    whatsappButton.hidden = false;
                    whatsappButton.disabled = true;

                    // Alihkan otomatis setelah 2 detik

                    setTimeout(() => {

                        window.location.href = data.url;

                    }, 2000);


                } else {

                    status.textContent = data.message || "Seluruh grup sedang penuh.";

                    loader.style.display = "none";
                    whatsappButton.style.display = "none";

                }


            } catch (error) {

                status.textContent =
                    "Terjadi kendala saat menghubungkan ke server. Silakan coba kembali.";

                loader.style.display = "none";
                whatsappButton.style.display = "none";
                console.error("Kesalahan:", error);

            }

        }


        // Jalankan alokasi grup otomatis

        mulaiRedirect();

    </script>
