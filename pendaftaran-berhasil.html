<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Berhasil | INDOAKSEL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px 40px;
      background: #f7f9fc;
      color: #263238;
      font-family: Comfortaa, Arial, sans-serif;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    /* TOMBOL KEMBALI */

    .back-button {
      display: inline-block;
      color: #287bce;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 22px;
    }

    .back-button:hover {
      text-decoration: underline;
    }

    /* JUDUL */

    .success-title {
      color: #287bce;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin: 0 0 20px;
    }

    /* DESKRIPSI */

    .section-description {
      color: #263238;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
      margin: 0 0 16px;
    }

    /* TOMBOL GRUP WHATSAPP */

    .whatsapp-button {
      display: table;
      width: auto;
      margin: 0 auto;
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      background: #2ead68;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background .18s;
    }

    .whatsapp-button:hover {
      background: #239456;
    }

    /* TAMPILAN HP */

    @media(max-width:520px) {
      body {
        padding: 16px 10px 15px;
      }

      .container {
        max-width: 100%;
      }

      .card {
        padding: 20px 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="card">

      <!-- TOMBOL KEMBALI -->

      <a
        href="ikuti-saluran-whatsapp.html"
        class="back-button"
      >
        ← Kembali
      </a>

      <!-- JUDUL PENDAFTARAN BERHASIL -->

      <h1 class="success-title">
        SELAMAT, PENDAFTARAN BERHASIL !
      </h1>

      <!-- INFORMASI PELATIHAN -->

      <p class="section-description">
        Pelatihan Online akan dilaksanakan melalui Zoom dan YouTube.
        Link Pelatihan Online akan kami bagikan melalui Grup WhatsApp
        menjelang kegiatan dimulai pada tanggal 18 Januari 2027.
      </p>

      <!-- AJAKAN BERGABUNG -->

      <p class="section-description">
        📌 Silakan bergabung ke Grup WhatsApp melalui tombol berikut.
      </p>

      <!-- TOMBOL GRUP WHATSAPP -->

      <a
        class="whatsapp-button"
        href="https://adminindoaksel.github.io/Gabung-Grup-WA-Pelatihan-Nasional"
        target="_blank"
        rel="noopener noreferrer"
      >
        KLIK GRUP WA
      </a>

    </div>

  </main>

</body>
</html>
